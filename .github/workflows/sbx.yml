name: Docker Sandboxes compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbx:
    name: sbx CLI surface (${{ matrix.version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: [v0.39.0, latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-excludes: caches/*/transforms
      - name: Download official sbx release
        env:
          SBX_RELEASE: ${{ matrix.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const release = process.env.SBX_RELEASE;
          const endpoint = release === 'latest' ? 'latest' : `tags/${release}`;
          const response = await fetch(`https://api.github.com/repos/docker/sbx-releases/releases/${endpoint}`, {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}` },
          });
          if (!response.ok) throw new Error(`Release discovery: ${response.status}`);
          const metadata = await response.json();
          const asset = metadata.assets.find(a => a.name === 'DockerSandboxes-linux-amd64.tar.gz');
          if (!asset) throw new Error('Linux amd64 release asset missing');
          console.log(`Testing Docker Sandboxes ${metadata.tag_name}: ${asset.browser_download_url}`);
          const download = await fetch(asset.browser_download_url);
          if (!download.ok) throw new Error(`Download: ${download.status}`);
          const bytes = Buffer.from(await download.arrayBuffer());
          const digest = `sha256:${createHash('sha256').update(bytes).digest('hex')}`;
          if (!asset.digest || digest !== asset.digest) throw new Error('Release digest mismatch or missing');
          writeFileSync(`${process.env.RUNNER_TEMP}/sbx.tar.gz`, bytes);
          JS
          tar -xzf "$RUNNER_TEMP/sbx.tar.gz" -C "$RUNNER_TEMP"
      - name: Check production argv against the installed CLI
        # No Docker login or VM needed. Live JSON remains an explicit authenticated-host gate.
        run: ./gradlew checkSbxContract -PsbxExecutable="$RUNNER_TEMP/docker-sbx/sbx"
      - name: Check JSON parsers and standalone launcher
        run: |
          ./gradlew test --tests '*SbxCliTest' --tests '*SbxOpenCodeServerBackendTest' --tests '*SbxLauncherTest'
          bash scripts/check-sbx-launcher.sh
      - name: Upload contract diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sbx-contract-${{ matrix.version }}
          path: |
            build/sbx-contract
            build/reports/tests/test

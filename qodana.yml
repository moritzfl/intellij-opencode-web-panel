# Qodana configuration:
# https://www.jetbrains.com/help/qodana/qodana-yaml.html

version: "1.0"
linter: jetbrains/qodana-jvm-community:2025.2
projectJDK: "21"
profile:
  name: qodana.recommended
exclude:
  - name: All
    paths:
      - .qodana
  # Product names (OpenCode, Docker Sandboxes, Reset Sandbox) trip sentence-case checks.
  - name: IncorrectStringCapitalization
